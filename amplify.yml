version: 1
build:
  image:
    baseImage: ubuntu_22
    nodeVersion: 20
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - cd backend && npm ci && cd ..
    build:
      commands:
        - npm run build    # runs frontend build and postbuild.sh
        # --- Inject all environment variables into backend/.env ---
        - |
          cat <<EOF > backend/.env
          USE_AWS=${USE_AWS}
          REGION=${REGION}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          DB_NAME=${DB_NAME}
          JWT_SECRET=${JWT_SECRET}
          ACCESS_KEY_ID=${ACCESS_KEY_ID}
          SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY}
          BUCKET_NAME=${BUCKET_NAME}
          BUCKET_REGION=${BUCKET_REGION}
          PRICECHARTING_TOKEN=${PRICECHARTING_TOKEN}
          VITE_API_URL=${VITE_API_URL}
          SES_FROM_EMAIL=${SES_FROM_EMAIL}
          FRONTEND_URL=${FRONTEND_URL}
          EOF
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - backend/node_modules/**/*
