version: 1
build:
  image:
    baseImage: ubuntu_22
    nodeVersion: 20
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - cd backend && npm ci && cd ..
    build:
      commands:
        - npm run build    # runs frontend build and then postbuild.sh
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - backend/node_modules/**/*
