version: 1
build:
  image:
    baseImage: ubuntu_22
    nodeVersion: 20
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build     # runs frontend build and postbuild packaging
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
